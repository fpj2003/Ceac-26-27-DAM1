<!doctype html>
<html lang="es">
  <head>
    <title>Añadir Médico</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
  </head>
  <body>
    <header>
      <h1>Registro de Profesional</h1>
      <a href="/" class="btn">Volver a la Lista</a>
    </header>
    <main>
      <div class="form-container">
        <h2>Introduzca los datos del médico</h2>
        <form action="/inserta" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" required placeholder="Ej. Juan">
            </div>
            
            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" name="apellidos" id="apellidos" required placeholder="Ej. Pérez García">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required placeholder="juan.perez@hospital.com">
            </div>
            
            <div class="form-group">
                <label for="especialidad">Especialidad</label>
                <input type="text" name="especialidad" id="especialidad" required placeholder="Ej. Cardiología">
            </div>
            
            <div class="form-group">
                <label for="numero_de_colegiado">Número de colegiado</label>
                <input type="text" name="numero_de_colegiado" id="numero_de_colegiado" required placeholder="Ej. 282812345">
            </div>

            <div class="form-group">
                <label for="activo">Estado</label>
                <select id="activo" name="activo">
                    <option value="1" selected>1 - Activo</option>
                    <option value="0">0 - No activo</option>
                </select>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary">Guardar Médico</button>
            </div>
        </form>
      </div>
    </main>
    <footer>
      &copy; 2026 Fernando Puig - Sistema de Gestión Médica
    </footer> 
  </body>
</html>
