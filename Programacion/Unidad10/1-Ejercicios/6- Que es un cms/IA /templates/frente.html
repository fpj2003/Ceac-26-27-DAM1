<!doctype html>
<html lang="es">
  <head>
    <title>Blog de Fernando Puig</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/estilo_frente.css">
  </head>
  <body>
    <header>
      <div style="text-align: right;">
        <a href="/login" style="background: #252b33; color: white; text-decoration: none; padding: 6px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; transition: 0.3s; opacity: 0.9;">Acceder</a>
      </div>
      <h1 style="margin-top: -15px;">Fernando Puig</h1>
      <h2>Blog personal</h2>
    </header>
    <main>
      {% for articulo in articulos %}
      <article>
        <h3>{{articulo.titulo}}</h3>
        <time>{{articulo.fecha}}</time>
        <p>{{articulo.contenido}}</p>
      </article>
			{% endfor %}
    </main>
      
    <footer>
      (c) 2026 Fernando Puig
    </footer>
  </body>
</html>
