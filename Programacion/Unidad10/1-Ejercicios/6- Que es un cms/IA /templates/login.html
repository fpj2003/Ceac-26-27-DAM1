<!doctype html>
<html lang="es">
  <head>
    <title>Acceso Administrador</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/estilo_admin.css">
  </head>
  <body id="admin" class="login-body">
    <div class="login-box">
      <h2 style="text-align: center; color: #17243b; margin-top: 0;">Acceso Admin</h2>
      
      {% if error %}
        <p style="color: #d9534f; text-align: center; font-weight: bold;">{{ error }}</p>
      {% endif %}
      
      <form action="/login" method="POST">
        <label for="usuario">Usuario</label>
        <input type="text" name="usuario" id="usuario" required>
        
        <label for="password">Contraseña</label>
        <input type="password" name="password" id="password" required>
        
        <input type="submit" value="Entrar">
      </form>
      <br>
      <a href="/" style="display: block; text-align: center; color: #5368e8; text-decoration: none; font-weight: bold;">← Volver al Blog</a>
    </div>
  </body>
</html>
