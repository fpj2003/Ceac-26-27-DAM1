<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html, body {
        background: lightgray;
        display: flex;
        flex-direction: column; /* Pone el header arriba y el div abajo */
        width: 100%;
        min-height: 100vh; /* Usa vh para asegurar que ocupa la pantalla entera */
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      
      header {
        margin-bottom: 20px; /* Un poco de espacio entre los botones y el cuadro blanco */
      }

      nav a {
        color: white;
        background: darkblue;
        padding: 5px;
        text-decoration: none;
        width: 100px;
        display: inline-block;
        text-align: center;
      }

      div {
        width: 450px; /* Más ancho que los 250px del formulario */
        min-height: 250px; 
        background: white;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: flex-start; /* flex-start para que los textos no se queden flotando en el centro si hay pocos */
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Formulario</a>
        <a href="/mostrar">Mostrar</a>
      </nav>
    </header>	
    
    <div>
        <h2>Medicos</h2>
        {% for medico in medicos %}
        <article>
            <h3>{{medico.nombre}}</h3>
            <p>{{medico.especialidad}}</p>
            <p>{{medico.numero_de_colegiado}}</p>
        </article>
        {% endfor %}
    </div>
  </body>
</html>
