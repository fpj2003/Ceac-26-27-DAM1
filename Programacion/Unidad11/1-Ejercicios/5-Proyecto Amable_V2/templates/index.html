<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amable AI - Web Generator</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg: #f3f4f6;
            --text: #1f2937;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        
        /* Formulario superior */
        .card {
            background: var(--card-bg);
            padding: 2.5rem 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        input[type="text"] {
            flex: 1;
            min-width: 300px;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 3rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }
        button {
            padding: 1rem 2rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 3rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner de carga */
        .loader-container {
            display: none;
            margin-top: 1.5rem;
            color: #6b7280;
            font-weight: 500;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(16, 185, 129, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Ventana de resultados (Abajo) */
        .result-window {
            display: none;
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .window-header {
            display: flex;
            background: #1f2937;
            color: white;
            justify-content: space-between;
            align-items: center;
        }
        .tabs-container {
            display: flex;
        }
        .tab {
            padding: 1rem 2rem;
            cursor: pointer;
            font-weight: 500;
            background: #374151;
            transition: background 0.3s;
            border-right: 1px solid #4b5563;
        }
        .tab:hover { background: #4b5563; }
        .tab.active { background: #1f2937; border-bottom: 2px solid var(--primary); }
        
        .status-indicator {
            padding-right: 1.5rem;
            font-size: 0.85rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .content-pane { display: none; }
        .content-pane.active { display: block; }
        
        iframe {
            width: 100%;
            height: 550px;
            border: none;
            background: white;
        }
        
        /* Nuevo estilo para el editor editable */
        .code-editor {
            width: 100%;
            height: 550px;
            margin: 0;
            padding: 1.5rem;
            background: #1f2937;
            color: #a7f3d0;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            box-sizing: border-box;
            display: block;
        }
        .code-editor:focus {
            box-shadow: inset 0 0 0 2px var(--primary);
        }

        .actions-bar {
            padding: 1rem 1.5rem;
            background: #f9fafb;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #e5e7eb;
        }
        .btn-download {
            background-color: #3b82f6;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
        }
        .btn-download:hover {
            background-color: #2563eb;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Interfaz Principal Superior -->
        <div class="card">
            <h1>Amable AI ✨</h1>
            <p class="subtitle">Dime qué tipo de página necesitas y la programaré para ti.</p>
            <form id="ai-form">
                <div class="input-group">
                    <input type="text" id="peticion" placeholder="Ej: Crea un formulario de contacto moderno..." autocomplete="off" required>
                    <button type="submit" id="submit-btn">Generar Web</button>
                </div>
                <div class="loader-container" id="loader">
                    <div class="spinner"></div> Generando código, por favor espera...
                </div>
            </form>
        </div>

        <!-- Ventana de Resultados Inferior -->
        <div class="result-window" id="result-window">
            <div class="window-header">
                <div class="tabs-container">
                    <div class="tab active" onclick="switchTab('preview')">👁️ Vista Previa</div>
                    <div class="tab" onclick="switchTab('code')">✍️ Editar HTML</div>
                </div>
                <div class="status-indicator" id="sync-status">
                    🟢 Sincronizado
                </div>
            </div>
            
            <div id="preview-tab" class="content-pane active">
                <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
            
            <div id="code-tab" class="content-pane">
                <!-- Se cambia pre/code por un textarea para permitir edición -->
                <textarea id="code-view" class="code-editor" spellcheck="false" placeholder="El código HTML aparecerá aquí..."></textarea>
            </div>
            
            <div class="actions-bar">
                <button class="btn-download" id="download-btn">⬇️ Descargar archivo .html</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('ai-form');
        const btn = document.getElementById('submit-btn');
        const loader = document.getElementById('loader');
        const resultWindow = document.getElementById('result-window');
        const codeView = document.getElementById('code-view');
        const previewFrame = document.getElementById('preview-frame');
        const downloadBtn = document.getElementById('download-btn');
        const syncStatus = document.getElementById('sync-status');
        
        let currentCode = '';

        // Manejar el envío del formulario usando AJAX (fetch)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const peticion = document.getElementById('peticion').value;
            
            btn.disabled = true;
            loader.style.display = 'block';
            resultWindow.style.display = 'none';

            try {
                const response = await fetch('/procesa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peticion })
                });
                
                const data = await response.json();
                
                if(data.status === 'success') {
                    currentCode = data.codigo;
                    
                    // Limpiar markdown si la IA se equivoca
                    currentCode = currentCode.replace(/^```html\n?/i, '').replace(/```$/i, '').trim();
                    
                    // Mostrar código en el textarea y vista previa
                    codeView.value = currentCode;
                    previewFrame.srcdoc = currentCode;
                    
                    resultWindow.style.display = 'block';
                    resultWindow.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    syncStatus.innerHTML = '🟢 Sincronizado';
                    
                } else {
                    alert('Hubo un error en el servidor: ' + data.message);
                }
            } catch (error) {
                alert('Error de conexión con el servidor.');
                console.error(error);
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        });

        // NUEVO: Escuchar cambios en el editor de código y actualizar la vista previa en tiempo real
        codeView.addEventListener('input', (e) => {
            currentCode = e.target.value;
            previewFrame.srcdoc = currentCode;
            
            // Animación sutil para indicar que se está actualizando
            syncStatus.innerHTML = '🔄 Actualizando...';
            clearTimeout(window.syncTimer);
            window.syncTimer = setTimeout(() => {
                syncStatus.innerHTML = '🟢 Sincronizado';
            }, 500);
        });

        // Descargar el código generado/editado
        downloadBtn.addEventListener('click', () => {
            if(!currentCode) return;
            const blob = new Blob([currentCode], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'amable_web_editada.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Cambiar entre pestañas
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content-pane').forEach(c => c.classList.remove('active'));
            
            if(tabName === 'preview') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('preview-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('code-tab').classList.add('active');
            }
        };
    </script>
</body>
</html>
