<!DOCTYPE html>

  <title>Mailing</title>
  <style>
 	body{
 		background:yellow;
 		animation: fondo 0.3s infinite;
 	}
	@keyframes fondo {
		0% { background-color: red; }    
		50% { background-color: yellow; }
		100% { background-color: red; }
  }
	table {
		background-color: cyan;

      }

      }
      
      table table{
      		background-color: purple; 
		text-align: center;
		font-size: 22px;
		animation: subtabla 0.3s infinite;
      
      }

            	0% { background-color: turquoise; }    
		50% { background-color: purple; }
		100% { background-color: turquoise; }
      }
	.mi-boton {
        	background-color: blue; 
        	color: yellow;
        	font-size: 30px;       	       	
        	padding: 5px; 
        	font-weight: bold;
        	animation: parpadeo 0.3s infinite; 
      	}	
     	@keyframes parpadeo {
        	0% { background-color: red; color: yellow; transform: scale(1); }
        	50% { background-color: lime; color: blue; transform: scale(1.2); }
        	100% { background-color: cyan; color: black; transform: scale(1); }
      }

      }
