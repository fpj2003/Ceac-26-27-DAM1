<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
    article button{
    		color:black;
    		background:white;
    		padding:5px;
    		text-decoration:none;
    		width:100px;
    		display:inline-block;
    		text-align:center;
    		display: block; 
        	margin-bottom: 10px; }
    div {
        font-size: 36px;       
        font-weight: bold;    
        text-align: center;    
        margin-bottom: 30px;   
        font-family: sans-serif;
      }
      
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 20px auto;
        background: ivory;
      }
	article{
	background: white;
	}	
    </style>
  </head>
  <body>
    <div>
    </div>
    <article>
      <p>¿Qué lenguaje de programación sufrió ayer un apocalipsis?</p>
      <button valor="correcto">PHP</button>
      <button valor="incorrecto">Python</button>
      <button valor="incorrecto">HTML</button>
      <button valor="incorrecto">Javascript</button>
    <article>
    <hr>
      <article>
      <p>¿Qué lenguaje de programación revela tu código al navegador?</p>
      <button valor="correcto">Javascript</button>
      <button valor="incorrecto">PHP</button>
      <button valor="incorrecto">Python</button>
      <button valor="incorrecto">MySQL</button>
    <article>
    <hr>
    <script>
      let contenedor = document.querySelector("div")
      let tiempo = 30
      // Dentro de un segundo ejecuta bucle
      let temporizador = setTimeout("bucle()",1000) 
     	     
      // Selecciono todos los botones
      let botones = document.querySelectorAll("button");
      // Recorro cada uno de los botones
      botones.forEach(function(boton){
        // Escucho qué ocurre cuando el usuario hace click
      	boton.onclick = function(){
     
          // Capturo el estado del boton
       let estado = boton.getAttribute("valor")
          // Si el estado es correcto
          if(estado == "correcto"){
            // Te pongo el fondo verde
          	boton.style.background = "green"
          // Pero si el estado es incorrecto
          }else if(estado == "incorrecto"){
            // te pongo el fondo rojo
          	boton.style.background = "red"
          }
        }
      })
      function bucle(){
        // Disminuyo el contador
        tiempo--;
        // Escribo un mensaje en consola
        contenedor.textContent = tiempo
        // Cuando el tiempo se acaba
        if(tiempo < 0){
        	contenedor.textContent = "El examen ha acabado"
        }
        // Quita la alarma del movil
      	clearTimeout(temporizador)
        // Pon otra para dentro de un segundo
        // Ojo que me estoy llamando a mi mismo
        temporizador = setTimeout("bucle()",1000)
      }
    </script>
  </body>
</html>
