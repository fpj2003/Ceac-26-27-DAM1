<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
  </head>
  <style>
  img{ width: 100px;}
  </style>
  <body>
    <img src=primera.jpeg>
    <button value="85" nombre="1ªEquipacion 26/27">1ªEquipacion 26/27 - 85€</button>
    <img src=segunda.jpeg>
    <button value="85" nombre="2ªEquipacion 26/27">2ªEquipacion 26/27 - 85€</button>
    <img src=tercera.avif>
    <button value="85" nombre="3ªEquipacion 26/27">3ªEquipacion 26/27 - 85€</button>
    <div id="detalle"></div>
    <div id="total"></div>
    <script>
      // Selecciono el escenario
      let escenario_total = document.querySelector("#total")
      let escenario_detalle = document.querySelector("#detalle")
      // Selecciono todos los botones
      let botones = document.querySelectorAll("button")
      // Creo una variable que al principio vale cero
      let total = 0;
      // Creo una lista vacia para guardar los productos
      let lista = []
      // Selecciono uno a uno
      botones.forEach(function(boton){
      	// Cuando hago click en cada boton
        boton.onclick = function(){
          // A la lista le añado el producto
          lista.push(boton.getAttribute("nombre"))
          // al total le sumo lo que vale el boton
        	total += boton.getAttribute("value")*1 // Implicita
          // Pinto el total en el escenario
          escenario_total.textContent = total
          escenario_detalle.textContent = lista
          alert("Se ha añadido su producto")
        }
      })
      	
    </script>
  </body>
</html>
